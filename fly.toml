app = 'dill-rustrooms'
primary_region = 'ord'

[build]
  dockerfile = 'Dockerfile'

[http_service]
  internal_port = 3000
  force_https = true

[env]
  RUSTROOMS_STATE_FILE = '/data/rustrooms_state.json'

[mounts]
  source = 'rustrooms_data'
  destination = '/data'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1